services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hms}
      POSTGRES_USER: ${POSTGRES_USER:-hms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-hms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-hms}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:-ZGV2LXNlY3JldC1tdXN0LWJlLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmc=}
      APP_CORS_ALLOWED_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      APP_MAIL_FROM: ${MAIL_FROM:-no-reply@hms.local}
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ | grep -q HMS"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
