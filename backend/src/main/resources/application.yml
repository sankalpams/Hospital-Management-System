server:
  port: 8081
  forward-headers-strategy: framework
spring:
  application:
    name: hms-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${SPRING_DATASOURCE_USERNAME:hms}
    password: ${SPRING_DATASOURCE_PASSWORD:hms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
  jackson:
    default-property-inclusion: non_null
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  cors.allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:ZGV2LXNlY3JldC1tdXN0LWJlLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmc=}
    access-token-minutes: 15
    refresh-token-days: 7
    lockout-minutes: 15
    max-failed-attempts: 5
  mail:
    from: ${APP_MAIL_FROM:no-reply@hms.local}
    reset-url: ${APP_RESET_URL:http://localhost:8080/reset-password}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:./uploads/documents}
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html
