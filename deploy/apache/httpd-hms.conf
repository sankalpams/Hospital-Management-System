# =============================================================================
# HMS - Apache HTTP Server 2.4 (Windows) virtual host
#
#   /        -> React production build (C:/hms/frontend), SPA fallback to index.html
#   /api/*   -> Spring Boot on 127.0.0.1:8080 (reverse proxy)
#
# Install: copy to C:/Apache24/conf/extra/httpd-hms.conf and add to httpd.conf:
#     Include conf/extra/httpd-hms.conf
# Required modules (uncomment in httpd.conf):
#     mod_proxy, mod_proxy_http, mod_headers, mod_deflate, mod_expires, mod_dir
# Validate:   C:\Apache24\bin\httpd.exe -t
# Full guide: docs/08-windows-deployment.md
# =============================================================================

Define HMS_WEB_ROOT "C:/hms/frontend"
Define HMS_BACKEND  "http://127.0.0.1:8080"

# ---------- Server-wide hardening (allowed in an included file) ---------------
# "Server: Apache", no version or OS
ServerTokens Prod
ServerSignature Off
TraceEnable Off
# Slow-connection (slowloris) protection; needs mod_reqtimeout, which is on by default
<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "${HMS_WEB_ROOT}"

    # ---------- Static SPA ----------------------------------------------------
    <Directory "${HMS_WEB_ROOT}">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Client-side routes (/patients/12, /login, ...) are served index.html
        FallbackResource /index.html
    </Directory>

    # Fingerprinted build assets can be cached for a year; index.html never.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>

    # ---------- API reverse proxy ---------------------------------------------
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /api/ ${HMS_BACKEND}/api/ timeout=60 retry=0
    ProxyPassReverse /api/ ${HMS_BACKEND}/api/
    # mod_proxy adds X-Forwarded-For/Host; the backend trusts these from 127.0.0.1 only.
    RequestHeader set X-Forwarded-Proto "http"
    # (If you terminate TLS here, use "https" and set HMS_COOKIE_SECURE=true.)

    <Location "/api/">
        # 10 MB documents + multipart overhead
        LimitRequestBody 11534336
        Header always set Cache-Control "no-store"
    </Location>

    # Never expose the Spring actuator beyond health.
    <LocationMatch "^/api/v1/actuator/(?!health$)">
        Require all denied
    </LocationMatch>

    # ---------- Security headers ----------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # ---------- Compression ---------------------------------------------------
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

    # ---------- Logs ----------------------------------------------------------
    ErrorLog  "logs/hms-error.log"
    CustomLog "logs/hms-access.log" combined
</VirtualHost>

# =============================================================================
# HTTPS (docs/08 section 9). When the hospital has a certificate:
#   1. enable mod_ssl and mod_rewrite, copy the certificate and key to C:/Apache24/conf/ssl/
#   2. uncomment the block below and the redirect, and set ServerName to the real host name
#   3. set HMS_COOKIE_SECURE=true in C:/hms/backend/hms-backend.xml and restart the hms-backend service
# The HTTP virtual host above then only redirects. Keep the same directives (copy them in) for the
# static files, the /api proxy, the headers and the logs; only the lines that differ are shown here.
# =============================================================================
# Listen 443
# <VirtualHost *:443>
#     ServerName hms.hospital.local
#     SSLEngine on
#     SSLCertificateFile    "conf/ssl/hms.crt"
#     SSLCertificateKeyFile "conf/ssl/hms.key"
#     SSLProtocol -all +TLSv1.2 +TLSv1.3
#     SSLHonorCipherOrder off
#     RequestHeader set X-Forwarded-Proto "https"
#     Header always set Strict-Transport-Security "max-age=31536000"
#     # ... the static, proxy, header and log directives from the :80 host ...
# </VirtualHost>
#
# In the :80 host, replace its contents with:
#     RewriteEngine On
#     RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
